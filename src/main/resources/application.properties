spring.application.name=Hovedopgave
server.port=8080
spring.web.error.include-stacktrace=always
spring.datasource.url=${MYSQL_URL:jdbc:h2:file:./data/hovedopgave;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
